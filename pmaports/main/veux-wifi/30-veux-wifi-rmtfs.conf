[Unit]
ConditionPathExists=/var/lib/rmtfs/modem_fs1
ConditionPathExists=/var/lib/rmtfs/modem_fs2
ConditionPathExists=/var/lib/rmtfs/modem_fsg

[Service]
# Serve private NV copies with an in-memory write shadow; startup belongs to
# veux-wifi.service, so do not use rmtfs -s or raw partition mode -P.
ExecStart=
ExecStart=/usr/bin/rmtfs -r -o /var/lib/rmtfs
StateDirectory=rmtfs
StateDirectoryMode=0700
Restart=on-failure
RestartSec=5
